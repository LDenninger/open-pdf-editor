[package]
name = "opdf-bench"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Performance benchmarks for open-pdf-editor, tracking the operations the project promises stay fast on large documents"
publish = false

[dependencies]
opdf-core = { path = "../../opdf-core" }

[dev-dependencies]
criterion = "0.8"

# The [[bench]] entries land with the benchmark files themselves -- a declared
# bench target whose file does not exist yet is a manifest parse error, not a
# missing-target warning, and would break `cargo build --all` for every track.
