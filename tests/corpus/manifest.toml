notes = "~274 MB scanned classical Chinese text, 1823 -- too large to check in. Used by the scheduled 'full corpus' verification job and local OPDF_CORPUS_FULL=1 runs. 2026-08-17: the nightly job went red on a 404 from source_url. The specimen is NOT gone -- archive.org's /download/ redirector was routing to a broken mirror node (dn760003.eu.archive.org, 404 then 500), while the item's own data nodes served the file normally. Verified against the archive.org metadata API the same day: the item still lists yanjingshiji1120ruan.pdf at 274454829 bytes, md5 2ed58eaf55fc82c3e6a9092ce7c813f0, sha1 ecd456fbfa200029a0c8cd94a8d80d6b489727f3, all three matching the local cached copy exactly -- so the pinned sha256 below still describes live upstream bytes and no coverage was lost. mirror_urls are those two data nodes, tried after source_url."
