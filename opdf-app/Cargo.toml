[package]
name = "opdf-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Desktop application"

[lib]
name = "opdf_app"
path = "src/lib.rs"

[[bin]]
name = "opdf"
path = "src/main.rs"

[dependencies]
opdf-core = { path = "../opdf-core" }
opdf-pdf = { path = "../opdf-pdf" }
opdf-render = { path = "../opdf-render" }
egui = "0.32"
eframe = { version = "0.32", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui-phosphor = "0.10"
rfd = "0.17"

[dev-dependencies]
opdf-core = { path = "../opdf-core", features = ["contract-tests"] }
