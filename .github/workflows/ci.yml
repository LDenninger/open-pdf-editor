name: CI

on:
  push:
    branches: [master]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        # Windows is deliberately absent: scripts/fetch-pdfium.sh supports
        # Linux and macOS only, so a Windows leg would fail at the fetch step
        # on every run and `continue-on-error` would hide it. Add it back
        # together with a Windows branch in the fetch script.
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    # Linux is the hard gate; macOS is best-effort per the README ("ship when
    # actually tested") and must not block a merge on its own while it is not
    # yet part of the release process.
    continue-on-error: ${{ matrix.os != 'ubuntu-latest' }}
    env:
      OPDF_PDFIUM_LIB_DIR: ${{ github.workspace }}/vendor/pdfium/lib
    steps:
      - uses: actions/checkout@v4
      # Pinned, and deliberately not @stable: a Rust release must not be able
      # to change what this gate means under a tree nobody touched. The version
      # is the one in rust-toolchain.toml and the two must be bumped together.
      # The toolchain-canary job in scheduled-verification.yml is what notices
      # when a bump is due.
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}
      - name: Fetch Pdfium
        run: ./scripts/fetch-pdfium.sh
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --all --all-features
