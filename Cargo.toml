[workspace]
resolver = "3"
members = ["opdf-core", "opdf-pdf", "opdf-render", "opdf-ops", "opdf-cli", "opdf-app"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/LDenninger/open-pdf-editor"

[workspace.dependencies]
thiserror = "2"
crossbeam-channel = "0.5"
