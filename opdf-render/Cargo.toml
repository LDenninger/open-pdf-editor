[package]
name = "opdf-render"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Rasterization backends and the render worker"

[dependencies]
opdf-core = { path = "../opdf-core" }
crossbeam-channel.workspace = true
pdfium-render = { version = "0.9.3", default-features = false, features = ["thread_safe", "pdfium_7881"] }

[features]
default = []
contract-tests = ["opdf-core/contract-tests"]

[dev-dependencies]
opdf-core = { path = "../opdf-core", features = ["contract-tests"] }
