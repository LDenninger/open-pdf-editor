[package]
name = "opdf-ops"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Page operations as invertible commands"

[dependencies]
opdf-core = { path = "../opdf-core" }

[dev-dependencies]
opdf-core = { path = "../opdf-core", features = ["contract-tests"] }
# Property tests for the invertibility claim every command in this crate makes.
# Kept off the workspace dependency table because no other crate needs it, and
# the root manifest is not this crate's to edit.
proptest = { version = "1", default-features = false, features = ["std"] }
